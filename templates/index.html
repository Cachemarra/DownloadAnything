<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Download Anything - Video & Audio Downloader</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;600&amp;family=Geist:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-surface-variant": "#494551",
            "surface-container": "#f2ecf4",
            "outline": "#7a7582",
            "inverse-primary": "#cfbcff",
            "primary": "#cfbcff",
            "error": "#ffb4ab",
            "outline-variant": "#cbc4d2",
            "on-surface": "#e6e0e9",
            "inverse-on-surface": "#322f35",
            "error-container": "#93000a",
            "on-tertiary-fixed-variant": "#594400",
            "secondary": "#cdc0e9",
            "on-tertiary-container": "#ffe089",
            "background": "#141218",
            "on-tertiary": "#3f3000",
            "on-secondary": "#342b4b",
            "on-error": "#690005",
            "on-tertiary-fixed": "#241a00",
            "tertiary-container": "#594400",
            "surface-bright": "#3b383e",
            "secondary-fixed-dim": "#cdc0e9",
            "on-secondary-fixed": "#1f1635",
            "on-primary-fixed-variant": "#4f378a",
            "surface-container-lowest": "#0f0d13",
            "surface": "#141218",
            "surface-container-highest": "#36343b",
            "on-primary": "#381e72",
            "surface-variant": "#494551",
            "inverse-surface": "#e6e0e9",
            "on-secondary-container": "#e1d4fd",
            "surface-container-low": "#1d1b20",
            "secondary-fixed": "#e9ddff",
            "secondary-container": "#4b4263",
            "primary-container": "#4f378a",
            "on-primary-fixed": "#22005d",
            "on-secondary-fixed-variant": "#4b4263",
            "surface-container-high": "#2b2930",
            "on-error-container": "#ffdad6",
            "tertiary": "#e7c365",
            "tertiary-fixed-dim": "#e7c365",
            "on-background": "#e6e0e9",
            "surface-tint": "#cfbcff",
            "tertiary-fixed": "#ffdf93",
            "primary-fixed-dim": "#cfbcff",
            "surface-dim": "#141218",
            "on-primary-container": "#e9ddff",
            "primary-fixed": "#e9ddff"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "9999px"
          },
          "fontFamily": {
            "display-lg": ["Newsreader", "serif"],
            "headline-md-mobile": ["Newsreader", "serif"],
            "body-lg": ["Hanken Grotesk", "sans-serif"],
            "body-md": ["Hanken Grotesk", "sans-serif"],
            "headline-md": ["Newsreader", "serif"],
            "headline-sm": ["Newsreader", "serif"],
            "label-md": ["JetBrains Mono", "monospace"],
            "headline-lg": ["Newsreader", "serif"],
            "headline-lg-mobile": ["Newsreader", "serif"],
            "label-sm": ["JetBrains Mono", "monospace"]
          },
          "fontSize": {
            "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "400" }],
            "headline-md-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "500" }],
            "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
            "headline-md": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "500" }],
            "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "500" }],
            "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "500" }],
            "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "500" }],
            "label-sm": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }]
          }
        },
      },
    }
  </script>
  <style>
    .tactile-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .inner-shadow-soft {
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
    }
    .progress-fill {
      transition: width 0.3s ease-in-out;
    }
    @keyframes spin-ccw {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .animate-spin-ccw {
      animation: spin-ccw 1s linear infinite;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col antialiased">

  <!-- TopNavBar -->
  <header class="w-full h-20 bg-background">
    <div class="max-w-[1200px] mx-auto px-4 md:px-8 flex justify-between items-center w-full h-full">
      <div class="font-display-lg text-3xl sm:text-display-lg font-semibold text-primary">
        Download Anything
      </div>
      <nav class="hidden md:flex gap-6">
        <a class="text-primary font-semibold border-b-2 border-primary pb-1 hover:text-primary transition-colors duration-200" href="#">
          <span class="font-label-md text-label-md">Browser</span>
        </a>
      </nav>
      <div class="flex items-center gap-3">
        <button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-200" onclick="document.documentElement.classList.toggle('dark')" title="Toggle Dark/Light Mode">
          <span class="material-symbols-outlined dark:hidden">dark_mode</span>
          <span class="material-symbols-outlined hidden dark:block">light_mode</span>
        </button>
        <button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-200" title="Settings">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <button class="p-2 text-on-surface-variant hover:text-primary transition-colors duration-200" title="Help">
          <span class="material-symbols-outlined">help</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 w-full py-8 md:py-16 px-4 md:px-8">
    <div class="max-w-[1200px] w-full mx-auto grid grid-cols-1 lg:grid-cols-[200px_1fr_200px] gap-6 items-start">
      
      <!-- Left Ad Placeholder -->
      <div class="w-full flex flex-col items-center justify-center min-h-[160px] lg:h-[400px] bg-surface-container-low border border-outline-variant/30 rounded-xl p-4 text-outline select-none">
        <span class="material-symbols-outlined mb-2 text-2xl">ad_units</span>
        <span class="font-label-md text-label-md uppercase tracking-wider text-xs">Advertisement</span>
      </div>

      <!-- Central Downloader Card -->
      <div class="w-full bg-surface-container-lowest rounded-xl p-6 md:p-8 tactile-shadow border border-surface-container-high relative overflow-hidden">
        
        <!-- Input Section -->
        <div class="flex flex-col sm:flex-row gap-3 items-center w-full mb-8">
          <div class="relative flex-1 w-full">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">link</span>
            <input id="url-input" class="w-full bg-surface-container-low text-on-surface font-body-lg text-body-lg rounded-full py-4 pl-12 pr-6 text-center sm:text-left border-none focus:ring-2 focus:ring-primary inner-shadow-soft outline-none transition-all placeholder:text-outline" placeholder="Paste your video link here..." type="text" autocomplete="off" spellcheck="false"/>
          </div>
          <button id="fetch-btn" class="w-full sm:w-auto bg-primary text-on-primary font-label-md text-label-md px-8 py-4 rounded-full hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shrink-0 shadow-sm min-w-[120px] disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="fetch-icon" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">download</span>
            <span id="fetch-text">Fetch</span>
          </button>
        </div>

        <!-- Error Alert Banner -->
        <div id="error-banner" class="hidden mb-6 bg-error-container/40 border border-error/50 rounded-xl p-4 flex items-start gap-3">
          <span class="material-symbols-outlined text-error shrink-0 mt-0.5">error</span>
          <p id="error-text" class="font-body-md text-on-error-container leading-snug"></p>
        </div>

        <!-- Dynamic Progress Bar -->
        <div id="progress-container" class="hidden mb-6 bg-surface-container-low rounded-xl p-4 border border-outline-variant/30">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <span id="progress-status-icon" class="material-symbols-outlined text-primary animate-spin-ccw">sync</span>
              <span id="progress-status-text" class="font-label-md text-label-md text-on-surface">Preparing...</span>
            </div>
            <span id="progress-percentage" class="font-label-md text-label-md text-primary font-bold">0%</span>
          </div>
          <div class="w-full bg-surface-container-high rounded-full h-3 overflow-hidden">
            <div id="progress-bar-fill" class="bg-primary h-full rounded-full progress-fill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Preview Section -->
        <div id="preview-section" class="hidden flex flex-col gap-6">
          
          <!-- Video Thumbnail -->
          <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-surface-container-high border border-outline-variant/30 flex items-center justify-center group">
            <img id="preview-thumb" class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity duration-300" src="" alt="Video thumbnail"/>
            <div class="absolute inset-0 bg-on-surface/10"></div>
            <button class="relative z-10 w-16 h-16 bg-surface-container-lowest/90 backdrop-blur-sm rounded-full flex items-center justify-center text-on-surface tactile-shadow hover:scale-105 transition-transform">
              <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            </button>
            <div id="preview-duration" class="absolute bottom-4 right-4 bg-on-surface/80 backdrop-blur-md text-on-primary font-label-md text-label-md px-3 py-1 rounded-full text-sm">--:--</div>
          </div>

          <!-- Video Details -->
          <div class="flex flex-col gap-1">
            <h2 id="preview-title" class="font-headline-sm text-headline-sm text-on-surface line-clamp-2"></h2>
            <p class="font-body-sm text-body-md text-on-surface-variant flex items-center gap-2">
              <span class="material-symbols-outlined text-[18px]">account_circle</span>
              <span id="preview-author-info"></span>
            </p>
          </div>

          <div class="w-full h-px bg-surface-container-high my-2"></div>

          <!-- Download Options Grid -->
          <div id="download-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamically populated formats -->
          </div>
        </div>
      </div>

      <!-- Right Ad Placeholder -->
      <div class="w-full flex flex-col items-center justify-center min-h-[160px] lg:h-[400px] bg-surface-container-low border border-outline-variant/30 rounded-xl p-4 text-outline select-none">
        <span class="material-symbols-outlined mb-2 text-2xl">ad_units</span>
        <span class="font-label-md text-label-md uppercase tracking-wider text-xs">Advertisement</span>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-surface-container-low w-full py-8 border-t border-outline-variant">
    <div class="max-w-[1200px] mx-auto px-4 md:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="font-display-lg text-3xl text-primary">
        Download Anything
      </div>
      <div class="font-body-md text-body-md text-on-surface-variant text-center">
        © 2026 Download Anything. Handcrafted for your archives.
      </div>
      <nav class="flex gap-4">
        <a class="font-label-md text-label-md text-on-surface-variant hover:underline decoration-primary/30 underline-offset-4" href="#">Privacy Policy</a>
        <a class="font-label-md text-label-md text-on-surface-variant hover:underline decoration-primary/30 underline-offset-4" href="#">Terms of Service</a>
        <a class="font-label-md text-label-md text-on-surface-variant hover:underline decoration-primary/30 underline-offset-4" href="#">Support</a>
      </nav>
    </div>
  </footer>

  <!-- Application Logic JavaScript -->
  <script>
    let currentVideoUrl = "";
    let activeEventSource = null;

    const urlInput = document.getElementById("url-input");
    const fetchBtn = document.getElementById("fetch-btn");
    const fetchIcon = document.getElementById("fetch-icon");
    const fetchText = document.getElementById("fetch-text");

    const errorBanner = document.getElementById("error-banner");
    const errorText = document.getElementById("error-text");

    const previewSection = document.getElementById("preview-section");
    const previewThumb = document.getElementById("preview-thumb");
    const previewDuration = document.getElementById("preview-duration");
    const previewTitle = document.getElementById("preview-title");
    const previewAuthorInfo = document.getElementById("preview-author-info");
    const downloadOptionsGrid = document.getElementById("download-options-grid");

    const progressContainer = document.getElementById("progress-container");
    const progressBarFill = document.getElementById("progress-bar-fill");
    const progressPercentage = document.getElementById("progress-percentage");
    const progressStatusText = document.getElementById("progress-status-text");
    const progressStatusIcon = document.getElementById("progress-status-icon");

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return "0:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) {
        return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "";
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function showError(message) {
      errorText.textContent = message;
      errorBanner.classList.remove("hidden");
    }

    function hideError() {
      errorBanner.classList.add("hidden");
    }

    function setFetchLoading(isLoading) {
      fetchBtn.disabled = isLoading;
      if (isLoading) {
        fetchIcon.textContent = "sync";
        fetchIcon.className = "material-symbols-outlined animate-spin-ccw";
        fetchText.textContent = "Fetching...";
      } else {
        fetchIcon.textContent = "download";
        fetchIcon.className = "material-symbols-outlined";
        fetchText.textContent = "Fetch";
      }
    }

    function renderFormatsGrid(formats) {
      downloadOptionsGrid.innerHTML = "";

      if (!formats || formats.length === 0) return;

      formats.forEach((fmt, index) => {
        const isMp3 = fmt.id === "mp3";
        const isFullSpan = isMp3 && (formats.length % 2 !== 0);

        let iconName = "sd";
        let iconBg = "bg-surface-container-high text-on-surface-variant";
        let hoverBg = "hover:bg-secondary-container/30";
        let btnColor = "text-primary group-hover:bg-primary group-hover:text-on-primary";

        if (isMp3) {
          iconName = "audio_file";
          iconBg = "bg-tertiary-container text-on-tertiary-container";
          hoverBg = "hover:bg-tertiary-container/30";
          btnColor = "text-tertiary group-hover:bg-tertiary group-hover:text-on-tertiary";
        } else {
          const height = parseInt(fmt.id) || 0;
          if (height >= 1080) {
            iconName = "hd";
            iconBg = "bg-secondary-container text-on-secondary-container";
          }
        }

        const sizeStr = fmt.filesize ? ` • ${formatBytes(fmt.filesize)}` : "";

        const card = document.createElement("div");
        card.className = `bg-surface-container-low ${hoverBg} transition-colors border border-outline-variant/50 rounded-lg p-4 flex items-center justify-between cursor-pointer group ${isFullSpan ? 'md:col-span-2' : ''}`;
        card.setAttribute("onclick", `triggerDownload('${fmt.id}')`);

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full ${iconBg} flex items-center justify-center">
              <span class="material-symbols-outlined">${iconName}</span>
            </div>
            <div class="flex flex-col">
              <span class="font-label-md text-label-md text-on-surface">${fmt.label}</span>
              <span class="font-body-sm text-body-md text-outline">${fmt.sublabel}${sizeStr}</span>
            </div>
          </div>
          <button class="${btnColor} w-10 h-10 rounded-full flex items-center justify-center transition-colors">
            <span class="material-symbols-outlined">download</span>
          </button>
        `;

        downloadOptionsGrid.appendChild(card);
      });
    }

    async function fetchMetadata() {
      const url = urlInput.value.trim();
      if (!url) {
        showError("Please enter a valid video link.");
        return;
      }

      hideError();
      previewSection.classList.add("hidden");
      
      progressContainer.classList.remove("hidden");
      progressBarFill.style.width = "100%";
      progressBarFill.classList.add("animate-pulse");
      progressPercentage.textContent = "...";
      progressStatusText.textContent = "Preparing...";
      progressStatusIcon.textContent = "sync";
      progressStatusIcon.className = "material-symbols-outlined text-primary animate-spin-ccw";

      setFetchLoading(true);

      try {
        const response = await fetch("/api/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Failed to fetch video information.");
        }

        currentVideoUrl = url;
        previewThumb.src = data.thumbnail || "";
        previewTitle.textContent = data.title || "Video Title";
        
        let estSizeStr = "";
        if (data.formats && data.formats.length > 0) {
          const maxFmt = data.formats[0];
          if (maxFmt.filesize) {
            estSizeStr = ` • ${formatBytes(maxFmt.filesize)} Estimated`;
          }
        }
        
        previewAuthorInfo.textContent = `${data.author || "Unknown Creator"}${estSizeStr}`;
        previewDuration.textContent = formatDuration(data.duration);

        renderFormatsGrid(data.formats || []);

        progressContainer.classList.add("hidden");
        progressBarFill.classList.remove("animate-pulse");
        previewSection.classList.remove("hidden");

      } catch (err) {
        progressContainer.classList.add("hidden");
        progressBarFill.classList.remove("animate-pulse");
        showError(err.message || "Could not retrieve video details. Please verify the URL.");
      } finally {
        setFetchLoading(false);
      }
    }

    fetchBtn.addEventListener("click", fetchMetadata);
    urlInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") fetchMetadata();
    });

    function generateTaskId() {
      return 'task-' + Math.random().toString(36).substring(2, 11) + '-' + Date.now();
    }

    function triggerDownload(quality) {
      if (!currentVideoUrl) {
        showError("No video selected. Please fetch a video link first.");
        return;
      }

      hideError();
      const taskId = generateTaskId();

      progressContainer.classList.remove("hidden");
      progressBarFill.classList.remove("animate-pulse");
      progressBarFill.style.width = "0%";
      progressPercentage.textContent = "0%";
      progressStatusText.textContent = "Preparing...";
      
      progressStatusIcon.textContent = "sync";
      progressStatusIcon.className = "material-symbols-outlined text-primary animate-spin-ccw";

      if (activeEventSource) {
        activeEventSource.close();
      }

      activeEventSource = new EventSource(`/api/progress/${taskId}`);

      activeEventSource.onmessage = function(event) {
        try {
          const payload = JSON.parse(event.data);
          if (typeof payload.progress === "number") {
            const pct = Math.min(100, Math.max(0, payload.progress));
            progressBarFill.style.width = `${pct}%`;
            progressPercentage.textContent = `${pct}%`;

            if (pct >= 100) {
              progressStatusText.textContent = "Complete!";
              progressStatusIcon.textContent = "check_circle";
              progressStatusIcon.className = "material-symbols-outlined text-primary";
              if (activeEventSource) {
                activeEventSource.close();
                activeEventSource = null;
              }
            } else if (pct > 0) {
              progressStatusText.textContent = "Downloading...";
            } else {
              progressStatusText.textContent = "Preparing...";
            }
          }
        } catch (e) {
          console.error("SSE parse error", e);
        }
      };

      activeEventSource.onerror = function() {
        if (activeEventSource) {
          activeEventSource.close();
          activeEventSource = null;
        }
      };

      const videoTitle = previewTitle.textContent || "download";
      const downloadUrl = `/api/download?url=${encodeURIComponent(currentVideoUrl)}&quality=${encodeURIComponent(quality)}&task_id=${encodeURIComponent(taskId)}&title=${encodeURIComponent(videoTitle)}`;
      
      // Use an invisible iframe so single-click automatically triggers the browser file download
      let iframe = document.getElementById("hidden-download-iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "hidden-download-iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      iframe.src = downloadUrl;
    }
  </script>
</body>
</html>
