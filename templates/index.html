<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Download Anything - Video &amp; Audio Downloader</title>
  <meta name="description" content="Download videos and audio from anywhere on the web. Free, fast, and private — no sign-up required."/>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            "display":  ["Newsreader", "serif"],
            "body":     ["Hanken Grotesk", "sans-serif"],
            "mono":     ["JetBrains Mono", "monospace"],
          },
        },
      },
    }
  </script>

  <style>
    /* -----------------------------------------------------------------------
       Vellum Minimalist – CSS Custom Properties
       Light mode = default; .dark overrides to Midnight Vellum.
    ----------------------------------------------------------------------- */
    :root {
      --color-bg:                  #fdf7ff;
      --color-surface:             #fdf7ff;
      --color-surface-low:         #f8f2fa;
      --color-surface-mid:         #f2ecf4;
      --color-surface-high:        #ece6ee;
      --color-surface-highest:     #e6e0e9;
      --color-on-surface:          #1d1b20;
      --color-on-surface-var:      #494551;
      --color-outline:             #7a7582;
      --color-outline-var:         #cbc4d2;
      --color-primary:             #4f378a;
      --color-on-primary:          #ffffff;
      --color-primary-container:   #6750a4;
      --color-on-primary-container:#e0d2ff;
      --color-secondary:           #63597c;
      --color-secondary-container: #e1d4fd;
      --color-on-secondary-container: #645a7d;
      --color-tertiary:            #765b00;
      --color-tertiary-container:  #c9a74d;
      --color-on-tertiary-container:#503d00;
      --color-error:               #ba1a1a;
      --color-error-container:     #ffdad6;
      --color-on-error-container:  #93000a;
      --color-on-tertiary:         #ffffff;
      --shadow-card: 0 4px 32px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-btn:  0 2px 10px rgba(79,55,138,0.22);
    }

    .dark {
      --color-bg:                  #141218;
      --color-surface:             #141218;
      --color-surface-low:         #1d1b20;
      --color-surface-mid:         #232127;
      --color-surface-high:        #2b2930;
      --color-surface-highest:     #36343b;
      --color-on-surface:          #e6e0e9;
      --color-on-surface-var:      #cac4d0;
      --color-outline:             #938f99;
      --color-outline-var:         #49454f;
      --color-primary:             #cfbcff;
      --color-on-primary:          #381e72;
      --color-primary-container:   #4f378a;
      --color-on-primary-container:#e9ddff;
      --color-secondary:           #cdc0e9;
      --color-secondary-container: #4b4263;
      --color-on-secondary-container: #e1d4fd;
      --color-tertiary:            #e7c365;
      --color-tertiary-container:  #594400;
      --color-on-tertiary-container:#ffe089;
      --color-error:               #ffb4ab;
      --color-error-container:     #93000a;
      --color-on-error-container:  #ffdad6;
      --color-on-tertiary:         #3f3000;
      --shadow-card: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 4px 24px rgba(0,0,0,0.4);
      --shadow-btn:  0 0 14px rgba(207,188,255,0.28);
    }

    /* -----------------------------------------------------------------------
       Base resets
    ----------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--color-bg);
      color: var(--color-on-surface);
      font-family: "Hanken Grotesk", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* -----------------------------------------------------------------------
       Theme Toggle Slider
    ----------------------------------------------------------------------- */
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .theme-toggle .toggle-icon {
      font-size: 18px;
      color: var(--color-on-surface-var);
      transition: color 0.2s ease, opacity 0.2s ease;
      user-select: none;
    }
    .theme-toggle-track {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 9999px;
      background-color: var(--color-outline-var);
      transition: background-color 0.25s ease;
      cursor: pointer;
      flex-shrink: 0;
    }
    .dark .theme-toggle-track {
      background-color: var(--color-primary-container);
    }
    .theme-toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 9999px;
      background-color: var(--color-on-primary);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.25s ease;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }
    .dark .theme-toggle-thumb {
      transform: translateX(20px);
      background-color: var(--color-primary);
    }

    /* -----------------------------------------------------------------------
       Header & Brand Logo
    ----------------------------------------------------------------------- */
    .app-header {
      background-color: var(--color-bg);
      border-bottom: 1px solid var(--color-outline-var);
      width: 100%;
      height: 76px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .brand-link:hover { opacity: 0.9; transform: translateY(-1px); }

    .brand-logo-icon {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(79,55,138,0.15));
    }
    .dark .brand-logo-icon {
      filter: drop-shadow(0 0 8px rgba(207,188,255,0.3));
    }

    .brand-title {
      font-family: "Newsreader", serif;
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 600;
      color: var(--color-primary);
      letter-spacing: -0.01em;
    }

    .nav-link {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--color-primary);
      text-decoration: none;
      border-bottom: 2px solid var(--color-primary);
      padding-bottom: 2px;
      transition: opacity 0.15s ease;
    }
    .nav-link:hover { opacity: 0.75; }

    /* -----------------------------------------------------------------------
       Main Layout (Side-by-side Ads Guarantee)
    ----------------------------------------------------------------------- */
    .main-layout-grid {
      display: grid;
      grid-template-columns: minmax(100px, 200px) 1fr minmax(100px, 200px);
      gap: 20px;
      align-items: start;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 1024px) {
      .main-layout-grid {
        grid-template-columns: 200px 1fr 200px;
        gap: 24px;
      }
    }

    /* -----------------------------------------------------------------------
       Cards
    ----------------------------------------------------------------------- */
    .card {
      background-color: var(--color-surface-low);
      border: 1px solid var(--color-outline-var);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .card-main {
      background-color: var(--color-surface);
    }
    .dark .card-main {
      background-color: #1a1824;
    }

    /* -----------------------------------------------------------------------
       Material 3 Modern Round Input Container & Field
    ----------------------------------------------------------------------- */
    .url-input-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .url-input-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-outline);
      font-size: 22px;
      pointer-events: none;
      z-index: 10;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .url-input-wrapper:focus-within .url-input-icon,
    .url-input-wrapper:hover .url-input-icon {
      color: var(--color-primary);
      transform: translateY(-50%) scale(1.1);
    }

    .url-input {
      background-color: var(--color-surface-low);
      color: var(--color-on-surface);
      border: 1.5px solid var(--color-outline-var);
      border-radius: 9999px;
      height: 56px;
      padding-top: 0;
      padding-bottom: 0;
      padding-left: 58px !important; /* Fixes text overlap over link icon */
      padding-right: 24px !important;
      text-align: left !important;
      font-family: "Hanken Grotesk", sans-serif;
      font-size: 16px;
      width: 100%;
      outline: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03), inset 0 1px 2px rgba(0,0,0,0.02);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.25s ease;
    }
    .url-input::placeholder {
      color: var(--color-outline);
      opacity: 0.85;
    }
    .url-input:hover {
      border-color: var(--color-outline);
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .url-input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-primary) 18%, transparent), 0 4px 16px rgba(0,0,0,0.08);
    }
    .dark .url-input {
      background-color: #1e1b26;
    }
    .dark .url-input:focus {
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-primary) 25%, transparent), 0 4px 20px rgba(0,0,0,0.3);
    }

    /* -----------------------------------------------------------------------
       Material 3 Expressive Fetch Button
    ----------------------------------------------------------------------- */
    .fetch-btn {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 9999px;
      height: 56px;
      padding: 0 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      box-shadow: var(--shadow-btn);
      transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, background-color 0.2s ease;
    }
    .fetch-btn:hover  { opacity: 0.92; box-shadow: 0 6px 20px rgba(79,55,138,0.32); transform: translateY(-1px); }
    .fetch-btn:active { transform: translateY(1px) scale(0.98); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* -----------------------------------------------------------------------
       Download format cards
    ----------------------------------------------------------------------- */
    .format-card {
      background-color: var(--color-surface-low);
      border: 1px solid color-mix(in srgb, var(--color-outline-var) 50%, transparent);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .format-card:hover { background-color: var(--color-surface-mid); transform: translateY(-1px); }

    .format-icon-bg-secondary {
      background-color: var(--color-secondary-container);
      color: var(--color-on-secondary-container);
    }
    .format-icon-bg-neutral {
      background-color: var(--color-surface-high);
      color: var(--color-on-surface-var);
    }
    .format-icon-bg-tertiary {
      background-color: var(--color-tertiary-container);
      color: var(--color-on-tertiary-container);
    }
    .format-download-btn {
      color: var(--color-primary);
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .format-card:hover .format-download-btn {
      background-color: var(--color-primary);
      color: var(--color-on-primary);
    }
    .format-download-btn-tertiary { color: var(--color-tertiary); }
    .format-card:hover .format-download-btn-tertiary {
      background-color: var(--color-tertiary);
      color: var(--color-on-tertiary);
    }

    /* -----------------------------------------------------------------------
       Progress bar
    ----------------------------------------------------------------------- */
    .progress-track {
      background-color: var(--color-surface-high);
      border-radius: 9999px;
      height: 10px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      background-color: var(--color-primary);
      height: 100%;
      border-radius: 9999px;
      transition: width 0.3s ease-in-out;
    }

    /* -----------------------------------------------------------------------
       Error banner
    ----------------------------------------------------------------------- */
    .error-banner {
      background-color: color-mix(in srgb, var(--color-error-container) 40%, transparent);
      border: 1px solid color-mix(in srgb, var(--color-error) 50%, transparent);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    /* -----------------------------------------------------------------------
       Side Ad Placeholders (Always Flanking Left & Right)
    ----------------------------------------------------------------------- */
    .ad-placeholder {
      background-color: var(--color-surface-low);
      border: 1px solid color-mix(in srgb, var(--color-outline-var) 30%, transparent);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-outline);
      user-select: none;
      transition: background-color 0.25s ease;
      min-height: 380px;
      width: 100%;
      padding: 16px;
      text-align: center;
    }

    /* -----------------------------------------------------------------------
       Footer
    ----------------------------------------------------------------------- */
    .app-footer {
      background-color: var(--color-surface-low);
      border-top: 1px solid var(--color-outline-var);
      padding: 32px 0;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }
    .footer-link {
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--color-on-surface-var);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-link:hover { color: var(--color-primary); text-decoration: underline; text-underline-offset: 4px; }

    /* -----------------------------------------------------------------------
       Utilities
    ----------------------------------------------------------------------- */
    .hidden { display: none !important; }

    @keyframes spin-ccw {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    .animate-spin-ccw { animation: spin-ccw 1s linear infinite; }

    .divider {
      width: 100%;
      height: 1px;
      background-color: var(--color-surface-high);
      margin: 8px 0;
    }

    .thumb-overlay { background-color: rgba(0,0,0,0.08); }
    .dark .thumb-overlay { background-color: rgba(0,0,0,0.2); }

    .play-btn {
      background-color: rgba(253, 247, 255, 0.9);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-card);
    }
    .dark .play-btn {
      background-color: rgba(26, 24, 36, 0.88);
    }

    .duration-chip {
      background-color: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ===== TopNavBar ===== -->
  <header class="app-header">
    <div class="header-inner">
      <!-- Brand Logo + Link -->
      <a href="/" id="home-link" class="brand-link" title="Return to home">
        <img src="/static/logo_icon.png" alt="Download Anything Logo" class="brand-logo-icon"/>
        <span class="brand-title">Download Anything</span>
      </a>

      <!-- Center Nav -->
      <nav class="hidden md:flex gap-6">
        <a class="nav-link" href="/">Browser</a>
      </nav>

      <!-- Right Controls -->
      <div style="display:flex; align-items:center; gap:16px;">
        <!-- Dark/Light Mode Toggle Slider -->
        <button
          id="theme-toggle-btn"
          class="theme-toggle"
          title="Toggle dark / light mode"
          aria-label="Toggle dark / light mode"
          onclick="toggleTheme()"
          style="background:none;border:none;padding:4px;"
        >
          <span class="material-symbols-outlined toggle-icon" id="icon-sun" style="font-size:19px;" aria-hidden="true">light_mode</span>
          <div class="theme-toggle-track" role="switch" aria-checked="false" id="toggle-track">
            <div class="theme-toggle-thumb" id="toggle-thumb"></div>
          </div>
          <span class="material-symbols-outlined toggle-icon" id="icon-moon" style="font-size:19px;" aria-hidden="true">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main style="flex:1; padding: 48px 16px;">
    <!-- Main Grid: Always 3 columns keeping Ads strictly on the Left & Right sides -->
    <div class="main-layout-grid" id="main-grid">

      <!-- Left Ad (Flanking on the left side) -->
      <div class="ad-placeholder" id="ad-left">
        <span class="material-symbols-outlined" style="font-size:26px; margin-bottom:8px;">ad_units</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase;">Advertisement</span>
      </div>

      <!-- Central Downloader Card -->
      <div class="card card-main" style="padding: 32px 28px; position:relative; overflow:hidden;">

        <!-- Input Row -->
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:32px;" id="input-row">
          <style>
            @media (min-width:640px) { #input-row { flex-direction:row; align-items:center; } }
          </style>
          
          <!-- Modern Round Material Input Wrapper -->
          <div class="url-input-wrapper">
            <span class="material-symbols-outlined url-input-icon">link</span>
            <input
              id="url-input"
              class="url-input"
              type="text"
              placeholder="Paste your video link here..."
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          
          <button id="fetch-btn" class="fetch-btn" style="min-width:130px; justify-content:center;">
            <span id="fetch-icon" class="material-symbols-outlined" style="font-variation-settings:'FILL' 1; font-size:20px;">download</span>
            <span id="fetch-text">Fetch</span>
          </button>
        </div>

        <!-- Error Banner -->
        <div id="error-banner" class="error-banner hidden" style="margin-bottom:24px;">
          <span class="material-symbols-outlined" style="color:var(--color-error);flex-shrink:0;margin-top:2px;">error</span>
          <p id="error-text" style="font-family:'Hanken Grotesk',sans-serif; font-size:15px; color:var(--color-on-error-container); margin:0;"></p>
        </div>

        <!-- Progress -->
        <div id="progress-container" class="hidden" style="margin-bottom:24px; background-color:var(--color-surface-low); border:1px solid color-mix(in srgb, var(--color-outline-var) 30%, transparent); border-radius:14px; padding:18px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <span id="progress-status-icon" class="material-symbols-outlined animate-spin-ccw" style="color:var(--color-primary);">sync</span>
              <span id="progress-status-text" style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:500; letter-spacing:0.05em; color:var(--color-on-surface);">Preparing...</span>
            </div>
            <span id="progress-percentage" style="font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:600; color:var(--color-primary);">0%</span>
          </div>
          <div class="progress-track">
            <div id="progress-bar-fill" class="progress-fill" style="width:0%;"></div>
          </div>
        </div>

        <!-- Preview Section -->
        <div id="preview-section" class="hidden" style="display:flex; flex-direction:column; gap:20px;">

          <!-- Thumbnail -->
          <div style="position:relative; width:100%; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background-color:var(--color-surface-high); border:1px solid color-mix(in srgb,var(--color-outline-var) 30%, transparent);">
            <img id="preview-thumb" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.92;transition:opacity 0.3s ease;" src="" alt="Video thumbnail"/>
            <div class="thumb-overlay" style="position:absolute;inset:0;"></div>
            <button class="play-btn" style="position:relative;z-index:10;width:56px;height:56px;border-radius:9999px;border:none;cursor:default;display:flex;align-items:center;justify-content:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
              <span class="material-symbols-outlined" style="font-size:28px;font-variation-settings:'FILL' 1;color:var(--color-on-surface);">play_arrow</span>
            </button>
            <div id="preview-duration" class="duration-chip" style="position:absolute;bottom:12px;right:12px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.04em;padding:4px 10px;border-radius:9999px;">--:--</div>
          </div>

          <!-- Video Details -->
          <div style="display:flex;flex-direction:column;gap:4px;">
            <h2 id="preview-title" style="font-family:'Newsreader',serif;font-size:22px;font-weight:500;line-height:1.3;color:var(--color-on-surface);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;"></h2>
            <p style="display:flex;align-items:center;gap:6px;font-size:14px;color:var(--color-on-surface-var);margin:0;">
              <span class="material-symbols-outlined" style="font-size:17px;">account_circle</span>
              <span id="preview-author-info"></span>
            </p>
          </div>

          <div class="divider"></div>

          <!-- Download Options -->
          <div id="download-options-grid" style="display:grid;grid-template-columns:1fr;gap:12px;">
            <style>
              @media (min-width:640px) { #download-options-grid { grid-template-columns: 1fr 1fr; } }
            </style>
          </div>
        </div>

      </div>

      <!-- Right Ad (Flanking on the right side) -->
      <div class="ad-placeholder" id="ad-right">
        <span class="material-symbols-outlined" style="font-size:26px; margin-bottom:8px;">ad_units</span>
        <span style="font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase;">Advertisement</span>
      </div>

    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="app-footer">
    <div style="max-width:1200px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; align-items:center; gap:16px; text-align:center;">
      <style>
        @media (min-width:768px) {
          .footer-inner { flex-direction:row !important; justify-content:space-between !important; }
        }
      </style>
      <div class="footer-inner" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;">
        <a href="/" class="brand-link">
          <img src="/static/logo_icon.png" alt="Download Anything Logo" class="brand-logo-icon" style="height:32px;"/>
          <span class="brand-title" style="font-size:20px;">Download Anything</span>
        </a>
        <p style="font-family:'Hanken Grotesk',sans-serif; font-size:14px; color:var(--color-on-surface-var); margin:0;">
          © 2026 Download Anything. Handcrafted for your archives.
        </p>
        <nav style="display:flex; gap:20px; align-items:center;">
          <a class="footer-link" href="/privacy-policy">Privacy Policy</a>
          <span style="color:var(--color-outline-var);">·</span>
          <a class="footer-link" href="/about">About</a>
        </nav>
      </div>
    </div>
  </footer>

  <!-- ===== Theme & App Logic ===== -->
  <script>
    // -----------------------------------------------------------------------
    // Theme management
    // -----------------------------------------------------------------------
    (function () {
      const stored = localStorage.getItem("theme");
      if (stored === "dark") {
        document.documentElement.classList.add("dark");
      }
    })();

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      document.getElementById("toggle-track").setAttribute("aria-checked", isDark ? "true" : "false");
    }

    document.addEventListener("DOMContentLoaded", function () {
      const isDark = document.documentElement.classList.contains("dark");
      document.getElementById("toggle-track").setAttribute("aria-checked", isDark ? "true" : "false");
    });

    // -----------------------------------------------------------------------
    // Download App Logic
    // -----------------------------------------------------------------------
    let currentVideoUrl = "";
    let activeEventSource = null;

    const urlInput   = document.getElementById("url-input");
    const fetchBtn   = document.getElementById("fetch-btn");
    const fetchIcon  = document.getElementById("fetch-icon");
    const fetchText  = document.getElementById("fetch-text");

    const errorBanner  = document.getElementById("error-banner");
    const errorText    = document.getElementById("error-text");

    const previewSection      = document.getElementById("preview-section");
    const previewThumb        = document.getElementById("preview-thumb");
    const previewDuration     = document.getElementById("preview-duration");
    const previewTitle        = document.getElementById("preview-title");
    const previewAuthorInfo   = document.getElementById("preview-author-info");
    const downloadOptionsGrid = document.getElementById("download-options-grid");

    const progressContainer  = document.getElementById("progress-container");
    const progressBarFill    = document.getElementById("progress-bar-fill");
    const progressPercentage = document.getElementById("progress-percentage");
    const progressStatusText = document.getElementById("progress-status-text");
    const progressStatusIcon = document.getElementById("progress-status-icon");

    function formatDuration(seconds) {
      if (!seconds || seconds <= 0) return "0:00";
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "";
      if (bytes < 1024 * 1024)       return `${(bytes / 1024).toFixed(1)} KB`;
      if (bytes < 1024 * 1024 * 1024) return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      return `${(bytes / (1024 * 1024 * 1024)).toFixed(2)} GB`;
    }

    function showError(message) {
      errorText.textContent = message;
      errorBanner.classList.remove("hidden");
    }

    function hideError() {
      errorBanner.classList.add("hidden");
    }

    function setFetchLoading(isLoading) {
      fetchBtn.disabled = isLoading;
      if (isLoading) {
        fetchIcon.textContent = "sync";
        fetchIcon.className = "material-symbols-outlined animate-spin-ccw";
        fetchText.textContent = "Fetching...";
      } else {
        fetchIcon.textContent = "download";
        fetchIcon.className = "material-symbols-outlined";
        fetchText.textContent = "Fetch";
      }
    }

    function renderFormatsGrid(formats) {
      downloadOptionsGrid.innerHTML = "";
      if (!formats || formats.length === 0) return;

      formats.forEach((fmt) => {
        const isMp3      = fmt.id === "mp3";
        const height     = isMp3 ? 0 : (parseInt(fmt.id) || 0);
        const isFullSpan = isMp3 && (formats.length % 2 !== 0);

        let iconName   = "sd";
        let iconBgClass = "format-icon-bg-neutral";
        let dlBtnClass  = "format-download-btn";

        if (isMp3) {
          iconName    = "audio_file";
          iconBgClass = "format-icon-bg-tertiary";
          dlBtnClass  = "format-download-btn format-download-btn-tertiary";
        } else if (height >= 1080) {
          iconName    = "hd";
          iconBgClass = "format-icon-bg-secondary";
        }

        const sizeStr = fmt.filesize ? ` • ${formatBytes(fmt.filesize)}` : "";

        const card = document.createElement("div");
        card.className = "format-card";
        if (isFullSpan) card.style.gridColumn = "1 / -1";
        card.setAttribute("onclick", `triggerDownload('${fmt.id}')`);

        card.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="${iconBgClass}" style="width:40px;height:40px;border-radius:9999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <span class="material-symbols-outlined" style="font-size:20px;">${iconName}</span>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px;">
              <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--color-on-surface);">${fmt.label}</span>
              <span style="font-family:'Hanken Grotesk',sans-serif;font-size:13px;color:var(--color-outline);">${fmt.sublabel}${sizeStr}</span>
            </div>
          </div>
          <button class="${dlBtnClass}">
            <span class="material-symbols-outlined" style="font-size:20px;">download</span>
          </button>
        `;
        downloadOptionsGrid.appendChild(card);
      });
    }

    async function fetchMetadata() {
      const url = urlInput.value.trim();
      if (!url) { showError("Please enter a valid video link."); return; }

      hideError();
      previewSection.classList.add("hidden");
      previewSection.style.display = "none";

      progressContainer.classList.remove("hidden");
      progressBarFill.style.width = "100%";
      progressBarFill.style.animation = "pulse 1.5s ease-in-out infinite";
      progressPercentage.textContent = "...";
      progressStatusText.textContent = "Preparing...";
      progressStatusIcon.textContent = "sync";
      progressStatusIcon.className = "material-symbols-outlined animate-spin-ccw";
      progressStatusIcon.style.color = "var(--color-primary)";

      setFetchLoading(true);

      try {
        const response = await fetch("/api/info", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Failed to fetch video information.");

        currentVideoUrl             = url;
        previewThumb.src            = data.thumbnail || "";
        previewTitle.textContent    = data.title || "Video Title";

        let estSizeStr = "";
        if (data.formats && data.formats.length > 0 && data.formats[0].filesize) {
          estSizeStr = ` • ${formatBytes(data.formats[0].filesize)} Estimated`;
        }
        previewAuthorInfo.textContent = `${data.author || "Unknown Creator"}${estSizeStr}`;
        previewDuration.textContent   = formatDuration(data.duration);

        renderFormatsGrid(data.formats || []);

        progressContainer.classList.add("hidden");
        progressBarFill.style.animation = "";
        previewSection.classList.remove("hidden");
        previewSection.style.display = "flex";

      } catch (err) {
        progressContainer.classList.add("hidden");
        progressBarFill.style.animation = "";
        showError(err.message || "Could not retrieve video details. Please verify the URL.");
      } finally {
        setFetchLoading(false);
      }
    }

    fetchBtn.addEventListener("click", fetchMetadata);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") fetchMetadata(); });

    function generateTaskId() {
      return 'task-' + Math.random().toString(36).substring(2, 11) + '-' + Date.now();
    }

    function triggerDownload(quality) {
      if (!currentVideoUrl) { showError("No video selected. Please fetch a video link first."); return; }

      hideError();
      const taskId = generateTaskId();

      progressContainer.classList.remove("hidden");
      progressBarFill.style.animation = "";
      progressBarFill.style.width     = "0%";
      progressPercentage.textContent  = "0%";
      progressStatusText.textContent  = "Preparing...";
      progressStatusIcon.textContent  = "sync";
      progressStatusIcon.className    = "material-symbols-outlined animate-spin-ccw";
      progressStatusIcon.style.color  = "var(--color-primary)";

      if (activeEventSource) { activeEventSource.close(); }

      const videoTitle = previewTitle.textContent || "download";
      const sseUrl = `/api/progress/${taskId}?url=${encodeURIComponent(currentVideoUrl)}&quality=${encodeURIComponent(quality)}`;
      activeEventSource = new EventSource(sseUrl);

      activeEventSource.onmessage = function(event) {
        try {
          const payload = JSON.parse(event.data);

          if (payload.error) {
            showError(payload.error);
            progressContainer.classList.add("hidden");
            if (activeEventSource) { activeEventSource.close(); activeEventSource = null; }
            return;
          }

          if (typeof payload.progress === "number") {
            const pct = Math.min(100, Math.max(0, payload.progress));
            progressBarFill.style.width    = `${pct}%`;
            progressPercentage.textContent = `${pct}%`;
            if (pct > 0 && pct < 100) progressStatusText.textContent = "Downloading...";
          }

          if (payload.done) {
            progressStatusText.textContent = "Complete!";
            progressStatusIcon.textContent = "check_circle";
            progressStatusIcon.className   = "material-symbols-outlined";
            if (activeEventSource) { activeEventSource.close(); activeEventSource = null; }

            const fileDeliveryUrl = `/api/file/${taskId}?title=${encodeURIComponent(videoTitle)}`;
            const a = document.createElement("a");
            a.href = fileDeliveryUrl;
            a.download = videoTitle;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          }
        } catch (e) { console.error("SSE parse error", e); }
      };

      activeEventSource.onerror = function() {
        if (activeEventSource) { activeEventSource.close(); activeEventSource = null; }
      };
    }
  </script>
</body>
</html>
