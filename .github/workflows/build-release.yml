name: Build & Release App Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux-x86_64
            ext: tar.gz
          - os: windows-latest
            platform_name: windows-x64
            ext: zip
          - os: macos-latest
            platform_name: macos-x64
            ext: tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set Version Environment Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0"
          fi
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script (Download ffmpeg & PyInstaller Build)
        run: |
          python build.py

      - name: Package Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $binName = "DownloadAnything-${ver}.exe"
          $artName = "DownloadAnything-${ver}-windows-x64.zip"
          Compress-Archive -Path "dist/${binName}" -DestinationPath $artName
          echo "ARTIFACT_NAME=${artName}" >> $env:GITHUB_ENV

      - name: Package Executable (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VER="${APP_VERSION}"
          BIN_NAME="DownloadAnything-${VER}"
          PLAT="${{ matrix.platform_name }}"
          ART_NAME="DownloadAnything-${VER}-${PLAT}.${{ matrix.ext }}"
          chmod +x "dist/${BIN_NAME}"
          tar -czvf "${ART_NAME}" -C dist "${BIN_NAME}"
          echo "ARTIFACT_NAME=${ART_NAME}" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_name }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
