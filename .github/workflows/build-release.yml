name: Build & Release App Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executable (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux-x86_64
            ext: tar.gz
          - os: windows-latest
            platform_name: windows-x64
            ext: zip
          - os: macos-latest
            platform_name: macos-arm64
            ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set Version Environment Variable
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v1.0.0"
          fi
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version: ${VERSION}"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Script (Download ffmpeg & PyInstaller Build)
        run: |
          python build.py

      - name: Package Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          $binName = "DownloadAnything-${ver}.exe"
          $artName = "DownloadAnything-${ver}-windows-x64.zip"
          if (Test-Path "dist\${binName}") {
            Compress-Archive -Path "dist\${binName}" -DestinationPath $artName -Force
            echo "ARTIFACT_NAME=${artName}" >> $env:GITHUB_ENV
          } else {
            echo "Error: dist\${binName} not found!"
            exit 1
          }

      - name: Package Executable (macOS Application Bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER="${APP_VERSION}"
          ART_NAME="DownloadAnything-${VER}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/DownloadAnything.app" "${ART_NAME}"
          echo "ARTIFACT_NAME=${ART_NAME}" >> $GITHUB_ENV

      - name: Package Executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER="${APP_VERSION}"
          BIN_NAME="DownloadAnything-${VER}"
          ART_NAME="DownloadAnything-${VER}-linux-x86_64.tar.gz"
          chmod +x "dist/${BIN_NAME}"
          tar -czvf "${ART_NAME}" -C dist "${BIN_NAME}"
          echo "ARTIFACT_NAME=${ART_NAME}" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform_name }}
          path: ${{ env.ARTIFACT_NAME }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Display Release Files
        run: |
          echo "Release artifacts to publish:"
          ls -lh release_artifacts/

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
